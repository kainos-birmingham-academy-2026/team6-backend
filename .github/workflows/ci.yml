name: CI

on:
  push:
  pull_request:
    branches: [main]
  # Fired by the frontend repo after it pushes a new image, so the frontend container app redeploys.
  repository_dispatch:
    types: [frontend-deployed]

concurrency:
  group: team6-backend-dev-terraform
  cancel-in-progress: false

jobs:
  test:
    name: Test and quality checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://user:password@localhost:5433/placeholder"
      - run: npm run lint
      - run: npm test

  build:
    name: Build and push Docker image
    needs: test
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: team6-backend

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        env:
          ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
        run: |
          docker build \
            --tag "$ACR_LOGIN_SERVER/$IMAGE_NAME:${{ github.sha }}" \
            --tag "$ACR_LOGIN_SERVER/$IMAGE_NAME:latest" \
            .

      - name: Log in to ACR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.AZURE_CLIENT_ID }}
          password: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Push image (main only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
        run: |
          docker push "$ACR_LOGIN_SERVER/$IMAGE_NAME:${{ github.sha }}"
          docker push "$ACR_LOGIN_SERVER/$IMAGE_NAME:latest"

  terraform:
    name: Deploy infrastructure
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure
    env:
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -backend-config="key=team6-dev.tfstate"

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -var-file=environments/dev.tfvars -var="backend_image_tag=${{ github.sha }}" -var="deploy_id=r${{ github.run_id }}" -input=false -lock-timeout=5m

      - name: Terraform Apply
        if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || github.event_name == 'repository_dispatch'
        run: terraform apply -auto-approve -var-file=environments/dev.tfvars -var="backend_image_tag=${{ github.sha }}" -var="deploy_id=r${{ github.run_id }}" -input=false -lock-timeout=5m
