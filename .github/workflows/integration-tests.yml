name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://user:password@localhost:5433/placeholder"

      - run: npx vitest run tests/integration.test.ts
        env:
          JWT_SECRET: "integration-test-secret"